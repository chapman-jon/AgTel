version: 2

models:
  # ---------------------------------------------------------------------------
  # Clean (staging) layer: 1:1 with each seed, passing every column through
  # unchanged except the enterprise ID, which is conformed to a single
  # representation — stripped of BST's legacy braced wrapping ({...}, on rows
  # last saved before the January 2022 BST maintenance release), case-folded to
  # lowercase (GUIDs are case-insensitive; SAP stores uppercase, BST/AD
  # lowercase) and with the all-zeros placeholder GUID (braced on BST legacy
  # rows) normalized to null (it means "unassigned"). Enterprise-ID uniqueness
  # is tested on the conformed value, rather than on the raw seed — on the clean
  # model itself where its grain is already one row per entity, otherwise on the
  # downstream model that restores that grain (bst_fields is a type 2 table, so
  # its EID uniqueness is tested on bst_current_fields; SAP re-keys plots, so
  # plot EID uniqueness is tested on sap_non_null_plots).
  # ---------------------------------------------------------------------------
  - name: ad_clean_farmers
    description: >
      ad_farmers with the enterprise ID conformed (lowercased; all-zeros
      placeholder GUID normalized to null). All other columns pass through.
    columns:
      - name: enterprise_id
        description: Conformed enterprise ID of the farmer; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: ad_clean_farms
    description: >
      ad_farms with the enterprise ID conformed (lowercased; all-zeros
      placeholder GUID normalized to null). All other columns pass through.
    columns:
      - name: enterprise_id
        description: Conformed enterprise ID of the farm; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: ad_clean_fields
    description: >
      ad_fields with the enterprise ID conformed (lowercased; all-zeros
      placeholder GUID normalized to null). All other columns pass through.
    columns:
      - name: enterprise_id
        description: Conformed enterprise ID of the field; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: bst_clean_growers
    description: >
      bst_growers with the enterprise ID conformed (legacy braces stripped;
      lowercased; all-zeros placeholder GUID normalized to null). All other
      columns pass through.
    columns:
      - name: entrpr_guid
        description: Conformed enterprise ID of the grower; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: bst_clean_farms
    description: >
      bst_farms with the enterprise ID conformed (legacy braces stripped;
      lowercased; all-zeros placeholder GUID normalized to null). All other
      columns pass through.
    columns:
      - name: entrpr_guid
        description: Conformed enterprise ID of the farm; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: bst_clean_fields
    description: >
      bst_fields with the enterprise ID conformed (legacy braces stripped;
      lowercased; all-zeros placeholder GUID normalized to null). All other
      columns pass through. bst_fields is a type 2 table — when a field's
      record is updated, the prior version is kept as another row with the
      same field_id — so this model stays 1:1 with the seed and carries every
      version. The stored GUID wrapping tracks when each row was last saved,
      so versions of the same field can differ in wrapping until conformed
      here. The (field_id, upd_dt) uniqueness test guarantees the
      latest-version selection in bst_current_fields is deterministic.
    data_tests:
      - unique_combination:
          columns: [field_id, upd_dt]
    columns:
      - name: entrpr_guid
        description: >
          Conformed enterprise ID of the field; null when unassigned. Not
          unique at this grain — prior versions of a field carry its EID too —
          uniqueness holds only on current rows, tested in bst_current_fields.
        data_tests:
          - is_lowercase
          - is_bare_guid

  - name: bst_current_fields
    description: >
      The current version of each BST field. bst_fields is a type 2 table —
      when a field's record is updated, the prior version is kept as another
      row with the same field_id — so this model keeps only the latest version
      per field: the row with the greatest upd_dt (a null upd_dt means the
      record was never updated, so it can only be current when it is the
      field's only row). One row per field, restoring the grain the rest of
      the pipeline expects. Enterprise-ID uniqueness is tested here, on
      current rows, rather than on bst_clean_fields, where historical
      versions repeat it.
    columns:
      - name: field_id
        description: BST native primary key for the field; one row per field.
        data_tests:
          - unique
          - not_null
      - name: entrpr_guid
        description: Conformed enterprise ID of the field; null when unassigned.
        data_tests:
          - unique

  - name: sap_clean_partners
    description: >
      ZAGT_PARTNER with the enterprise ID conformed (lowercased from SAP's
      uppercase; all-zeros placeholder GUID normalized to null). All other columns
      pass through.
    columns:
      - name: ZZEID
        description: Conformed enterprise ID of the partner; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: sap_clean_farms
    description: >
      ZAGT_FARM with the enterprise ID conformed (lowercased from SAP's uppercase;
      all-zeros placeholder GUID normalized to null). All other columns pass
      through.
    columns:
      - name: ZZEID
        description: Conformed enterprise ID of the farm; null when unassigned.
        data_tests:
          - unique
          - is_lowercase
          - is_bare_guid

  - name: sap_clean_plots
    description: >
      ZAGT_PLOT with the enterprise ID conformed (lowercased from SAP's uppercase;
      all-zeros placeholder GUID normalized to null). All other columns pass
      through.
    columns:
      - name: ZZEID
        description: >
          Conformed enterprise ID of the plot; null when unassigned. Not unique at
          this grain — SAP re-keys plots, so several plot records can share one plot
          EID; uniqueness holds only after de-duplication in sap_non_null_plots.
        data_tests:
          - is_lowercase
          - is_bare_guid

  - name: ad_active_farmers
    description: >
      AD farmers filtered to is_test = false and status = active.
    columns:
      - name: farmer_id
        description: AD native primary key for the farmer.
        data_tests:
          - unique
          - not_null
      - name: is_test
        description: "`true` if the record was created for testing purposes during the port."
        data_tests:
          - not_null
          - accepted_values:
              values: [false]
              quote: false
      - name: status
        description: "Record status."
        data_tests:
          - not_null
          - accepted_values:
              values: [active]

  - name: ad_active_farms
    description: >
      AD farms filtered to is_test = false and status = active.
    columns:
      - name: farm_id
        description: AD native primary key for the farm.
        data_tests:
          - unique
          - not_null
      - name: is_test
        description: "`true` if the record was created for testing purposes during the port."
        data_tests:
          - not_null
          - accepted_values:
              values: [false]
              quote: false
      - name: status
        description: "Record status."
        data_tests:
          - not_null
          - accepted_values:
              values: [active]

  - name: ad_active_fields
    description: >
      AD fields filtered to is_test = false and status = active.
    columns:
      - name: field_id
        description: AD native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: is_test
        description: "`true` if the record was created for testing purposes during the port."
        data_tests:
          - not_null
          - accepted_values:
              values: [false]
              quote: false
      - name: status
        description: "Record status."
        data_tests:
          - not_null
          - accepted_values:
              values: [active]

  - name: bst_active_growers
    description: >
      BST growers filtered to stat_cd = 'A' (active) in the United States and
      Canada (excludes BST-only Australia). BST has no test-record flag.
    columns:
      - name: grower_id
        description: BST native primary key for the grower.
        data_tests:
          - unique
          - not_null
      - name: stat_cd
        description: "Record status code."
        data_tests:
          - not_null
          - accepted_values:
              values: [A]
      - name: country
        description: Country, stored as full name.
        data_tests:
          - not_null
          - accepted_values:
              values: ["United States", "Canada"]

  - name: bst_active_farms
    description: >
      BST farms filtered to stat_cd = 'A' (active) in the United States and
      Canada (excludes BST-only Australia).
    columns:
      - name: farm_id
        description: BST native primary key for the farm.
        data_tests:
          - unique
          - not_null
      - name: stat_cd
        description: "Record status code."
        data_tests:
          - not_null
          - accepted_values:
              values: [A]
      - name: country
        description: Country, stored as full name.
        data_tests:
          - not_null
          - accepted_values:
              values: ["United States", "Canada"]

  - name: bst_active_fields
    description: >
      Current BST fields (latest version per field, from bst_current_fields)
      filtered to stat_cd = 'A' (active), field_use_cd = 'PROD' (production
      fields, excluding trial plots), in the United States and Canada
      (excludes BST-only Australia).
    columns:
      - name: field_id
        description: BST native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: stat_cd
        description: "Record status code."
        data_tests:
          - not_null
          - accepted_values:
              values: [A]
      - name: field_use_cd
        description: "Field use code."
        data_tests:
          - not_null
          - accepted_values:
              values: [PROD]
      - name: country
        description: Country, stored as full name.
        data_tests:
          - not_null
          - accepted_values:
              values: ["United States", "Canada"]

  - name: sap_active_partners
    description: >
      SAP partners filtered to ZZSTAT = '02' (active), not flagged for deletion
      (LOEVM <> 'X'), PARTNER_TYPE = 'C' (customers, excluding prospects), in the
      US and Canada (excludes SAP-only Brazil).
    columns:
      - name: PARTNER_ID
        description: SAP native key for the business partner.
        data_tests:
          - unique
          - not_null
      - name: ZZSTAT
        description: "Partner lifecycle status code."
        data_tests:
          - not_null
          - accepted_values:
              values: ["02"]
      - name: PARTNER_TYPE
        description: "Partner type code."
        data_tests:
          - not_null
          - accepted_values:
              values: [C]
      - name: LAND1
        description: Country, ISO 3166-1 alpha-2 code.
        data_tests:
          - not_null
          - accepted_values:
              values: [US, CA]
      - name: LOEVM
        description: Deletion flag; always null here since LOEVM = 'X' rows are excluded.
        data_tests:
          - is_null

  - name: sap_active_farms
    description: >
      SAP farms filtered to ZZSTAT = '02' (active), not flagged for deletion
      (LOEVM <> 'X'), in the US and Canada (excludes SAP-only Brazil).
    columns:
      - name: FARM_ID
        description: SAP native key for the farm.
        data_tests:
          - unique
          - not_null
      - name: ZZSTAT
        description: "Farm lifecycle status code."
        data_tests:
          - not_null
          - accepted_values:
              values: ["02"]
      - name: LAND1
        description: Country, ISO 3166-1 alpha-2 code.
        data_tests:
          - not_null
          - accepted_values:
              values: [US, CA]
      - name: LOEVM
        description: Deletion flag; always null here since LOEVM = 'X' rows are excluded.
        data_tests:
          - is_null

  - name: sap_active_plots
    description: >
      SAP plots filtered to ZZSTAT = '02' (active), not flagged for deletion
      (LOEVM <> 'X'), in the US and Canada (excludes SAP-only Brazil).
    columns:
      - name: PLOT_ID
        description: SAP native key for the plot.
        data_tests:
          - unique
          - not_null
      - name: ZZSTAT
        description: "Plot lifecycle status code."
        data_tests:
          - not_null
          - accepted_values:
              values: ["02"]
      - name: LAND1
        description: Country, ISO 3166-1 alpha-2 code.
        data_tests:
          - not_null
          - accepted_values:
              values: [US, CA]
      - name: LOEVM
        description: Deletion flag; always null here since LOEVM = 'X' rows are excluded.
        data_tests:
          - is_null

  - name: ad_joined_fields
    description: >
      Active AD fields joined up the hierarchy to their active farm and active
      farmer (inner joins). One row per active field whose farm and farmer are
      also active. Carries only the source-system ID and enterprise ID at each
      level.
    columns:
      - name: field_id
        description: AD native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field.
        data_tests:
          - unique
      - name: farm_id
        description: AD native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm.
      - name: farmer_id
        description: AD native primary key for the farm's farmer.
        data_tests:
          - not_null
      - name: farmer_enterprise_id
        description: Enterprise ID of the farmer.

  - name: bst_joined_fields
    description: >
      Active BST fields joined up the hierarchy to their active farm and active
      grower (inner joins). One row per active field whose farm and grower are
      also active. Carries only the source-system ID and enterprise ID at each
      level.
    columns:
      - name: field_id
        description: BST native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field.
        data_tests:
          - unique
      - name: farm_id
        description: BST native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm.
      - name: grower_id
        description: BST native primary key for the farm's grower.
        data_tests:
          - not_null
      - name: grower_enterprise_id
        description: Enterprise ID of the grower.

  - name: sap_joined_plots
    description: >
      Active SAP plots joined up the hierarchy to their active farm and active
      partner (inner joins). One row per active plot whose farm and partner are
      also active. Carries only the source-system ID and enterprise ID at each
      level.
    columns:
      - name: plot_id
        description: SAP native key for the plot.
        data_tests:
          - unique
          - not_null
      - name: plot_enterprise_id
        description: >
          Enterprise ID of the plot. Not unique here — SAP re-keys plots, so
          several plot records can share one plot EID; uniqueness is asserted after
          de-duplication in sap_non_null_plots.
      - name: farm_id
        description: SAP native key for the plot's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm.
      - name: partner_id
        description: SAP native key for the farm's partner.
        data_tests:
          - not_null
      - name: partner_enterprise_id
        description: Enterprise ID of the partner.

  - name: ad_null_fields
    description: >
      Rows from ad_joined_fields where at least one enterprise ID (field, farm,
      or farmer) is null. Enterprise IDs are conformed upstream in ad_clean_*,
      where the all-zeros placeholder GUID is normalized to null, so both
      genuinely-missing and placeholder EIDs land here. I.e. active AD fields that
      could not be fully matched across systems because an enterprise ID has not
      yet been assigned at some level of the hierarchy.
    data_tests:
      - at_least_one_null:
          columns: [field_enterprise_id, farm_enterprise_id, farmer_enterprise_id]
    columns:
      - name: field_id
        description: AD native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field; may be null.
      - name: farm_id
        description: AD native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm; may be null.
      - name: farmer_id
        description: AD native primary key for the farm's farmer.
        data_tests:
          - not_null
      - name: farmer_enterprise_id
        description: Enterprise ID of the farmer; may be null.

  - name: bst_null_fields
    description: >
      Rows from bst_joined_fields where at least one enterprise ID (field, farm,
      or grower) is null. Enterprise IDs are conformed upstream in bst_clean_*,
      where the all-zeros placeholder GUID is normalized to null, so both
      genuinely-missing and placeholder EIDs land here. I.e. active BST fields that
      could not be fully matched across systems because an enterprise ID has not
      yet been assigned at some level of the hierarchy.
    data_tests:
      - at_least_one_null:
          columns: [field_enterprise_id, farm_enterprise_id, grower_enterprise_id]
    columns:
      - name: field_id
        description: BST native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field; may be null.
      - name: farm_id
        description: BST native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm; may be null.
      - name: grower_id
        description: BST native primary key for the farm's grower.
        data_tests:
          - not_null
      - name: grower_enterprise_id
        description: Enterprise ID of the grower; may be null.

  - name: sap_null_plots
    description: >
      Rows from sap_joined_plots where at least one enterprise ID (plot, farm,
      or partner) is null. Enterprise IDs are conformed upstream in sap_clean_*,
      where the all-zeros placeholder GUID is normalized to null, so both
      genuinely-missing and placeholder EIDs land here. I.e. active SAP plots that
      could not be fully matched across systems because an enterprise ID has not
      yet been assigned at some level of the hierarchy.
    data_tests:
      - at_least_one_null:
          columns: [plot_enterprise_id, farm_enterprise_id, partner_enterprise_id]
    columns:
      - name: plot_id
        description: SAP native key for the plot.
        data_tests:
          - unique
          - not_null
      - name: plot_enterprise_id
        description: Enterprise ID of the plot; may be null.
      - name: farm_id
        description: SAP native key for the plot's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm; may be null.
      - name: partner_id
        description: SAP native key for the farm's partner.
        data_tests:
          - not_null
      - name: partner_enterprise_id
        description: Enterprise ID of the partner; may be null.

  - name: ad_non_null_fields
    description: >
      Rows from ad_joined_fields where every enterprise ID (field, farm, and
      farmer) is populated. Enterprise IDs are conformed upstream in ad_clean_*,
      where the all-zeros placeholder GUID is normalized to null, so placeholder
      EIDs are excluded here just like genuine nulls. I.e. active AD fields that
      are fully matchable across systems because an enterprise ID has been assigned
      at every level of the hierarchy. Complement of ad_null_fields.
    columns:
      - name: field_id
        description: AD native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field.
        data_tests:
          - unique
          - not_null
      - name: farm_id
        description: AD native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm.
        data_tests:
          - not_null
      - name: farmer_id
        description: AD native primary key for the farm's farmer.
        data_tests:
          - not_null
      - name: farmer_enterprise_id
        description: Enterprise ID of the farmer.
        data_tests:
          - not_null

  - name: bst_non_null_fields
    description: >
      Rows from bst_joined_fields where every enterprise ID (field, farm, and
      grower) is populated. Enterprise IDs are conformed upstream in bst_clean_*,
      where the all-zeros placeholder GUID is normalized to null, so placeholder
      EIDs are excluded here just like genuine nulls. I.e. active BST fields that
      are fully matchable across systems because an enterprise ID has been assigned
      at every level of the hierarchy. Complement of bst_null_fields.
    columns:
      - name: field_id
        description: BST native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field.
        data_tests:
          - unique
          - not_null
      - name: farm_id
        description: BST native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm.
        data_tests:
          - not_null
      - name: grower_id
        description: BST native primary key for the farm's grower.
        data_tests:
          - not_null
      - name: grower_enterprise_id
        description: Enterprise ID of the grower.
        data_tests:
          - not_null

  - name: sap_non_null_plots
    description: >
      Rows from sap_joined_plots where every enterprise ID (plot, farm, and
      partner) is populated, de-duplicated to one row per distinct (plot, farm,
      partner) EID triple. Enterprise IDs are conformed upstream in sap_clean_*,
      where the all-zeros placeholder GUID is normalized to null, so placeholder
      EIDs are excluded here just like genuine nulls. SAP re-keys plots — the same
      physical field re-surveyed under a new PLOT_ID but sharing the same EID
      triple — so those rows collapse to a single field (lowest PLOT_ID kept) and
      parity counts each field once. I.e. the distinct, fully-matchable SAP fields.
      Complement of sap_null_plots, which keeps every unassigned-EID plot as its own
      row (an unmatched record can't be de-duplicated).
    data_tests:
      - unique_combination:
          columns: [plot_enterprise_id, farm_enterprise_id, partner_enterprise_id]
    columns:
      - name: plot_id
        description: >
          SAP native key of the representative plot kept for this field (the lowest
          PLOT_ID of the collapsed re-keyed rows). No longer the model's grain — the
          EID triple is — so it is not tested for uniqueness here.
        data_tests:
          - not_null
          - unique
      - name: plot_enterprise_id
        description: Enterprise ID of the plot.
        data_tests:
          - not_null
      - name: farm_id
        description: SAP native key for the plot's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm.
        data_tests:
          - not_null
      - name: partner_id
        description: SAP native key for the farm's partner.
        data_tests:
          - not_null
      - name: partner_enterprise_id
        description: Enterprise ID of the partner.
        data_tests:
          - not_null

  - name: unioned_eids
    description: >
      Enterprise IDs for every fully-matched field hierarchy across all three
      sources (AD, BST, SAP), stacked into a common (farmer, farm, field) shape
      and de-duplicated. The top level is farmer (AD) / grower (BST) / partner
      (SAP) and the leaf is field (AD, BST) / plot (SAP); all map to the same
      real-world entities via their shared enterprise IDs. Sourced from the
      non_null models, so every EID is populated. Rows that are identical across
      sources (the cross-system overlap) collapse to one, so there are no
      duplicate rows.
    data_tests:
      - unique_combination:
          columns: [farmer_eid, farm_eid, field_eid]
    columns:
      - name: farmer_eid
        description: >
          Enterprise ID of the farmer-level entity (farmer in AD, grower in BST,
          partner in SAP).
        data_tests:
          - not_null
      - name: farm_eid
        description: Enterprise ID of the farm.
        data_tests:
          - not_null
      - name: field_eid
        description: >
          Enterprise ID of the field-level entity (field in AD and BST, plot in
          SAP).
        data_tests:
          - not_null

  - name: non_null_joined
    description: >
      The universe of fully-matched field-hierarchy enterprise IDs
      (unioned_eids) left-joined back to each source's non_null model to record,
      per (farmer, farm, field) EID triple, which of the three systems contain
      that exact triple. One row per distinct triple; in_ad / in_bst / in_sap
      flag membership. The join key is the full triple, so a source is flagged
      present only when it ties the same field to the same farm and farmer.
      Feeds the downstream field-parity (Venn) table.
    data_tests:
      - unique_combination:
          columns: [farmer_eid, farm_eid, field_eid]
    columns:
      - name: farmer_eid
        description: >
          Enterprise ID of the farmer-level entity (farmer in AD, grower in BST,
          partner in SAP).
        data_tests:
          - not_null
      - name: farm_eid
        description: Enterprise ID of the farm.
        data_tests:
          - not_null
      - name: field_eid
        description: >
          Enterprise ID of the field-level entity (field in AD and BST, plot in
          SAP).
        data_tests:
          - not_null
      - name: in_ad
        description: True when this exact EID triple exists in the AD non_null model.
        data_tests:
          - not_null
      - name: in_bst
        description: True when this exact EID triple exists in the BST non_null model.
        data_tests:
          - not_null
      - name: in_sap
        description: True when this exact EID triple exists in the SAP non_null model.
        data_tests:
          - not_null

  - name: non_null_parity
    description: >
      Field-parity table aggregating non_null_joined to one row per Venn region:
      each distinct combination of which systems contain a fully-matched
      (farmer, farm, field) EID triple. bst / sap / ad are 1/0 membership flags
      and count is the number of triples in that region. The all-zero region
      never appears because every triple belongs to at least one source, so the
      counts sum to the full non_null_joined population. Feeds the parity Venn
      diagram and overall parity metric.
    data_tests:
      - unique_combination:
          columns: [bst, sap, ad]
    columns:
      - name: bst
        description: 1 if the triple exists in BST, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: sap
        description: 1 if the triple exists in SAP, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: ad
        description: 1 if the triple exists in AD, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: count
        description: Number of distinct EID triples in this region.
        data_tests:
          - not_null

  - name: all_comb
    description: >
      non_null_parity with every non-empty membership combination guaranteed
      present. A region with no fully-matched triples is absent from
      non_null_parity; this model backfills those combinations with a count of 0
      so all 2^3 - 1 = 7 non-empty (bst, sap, ad) combinations always appear. The
      all-zero combination is intentionally excluded. Downstream of
      non_null_parity, upstream of field_parity.
    data_tests:
      - unique_combination:
          columns: [bst, sap, ad]
    columns:
      - name: bst
        description: 1 if the triple exists in BST, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: sap
        description: 1 if the triple exists in SAP, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: ad
        description: 1 if the triple exists in AD, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: count
        description: >
          Number of distinct fully-matched EID triples in this region; 0 for a
          backfilled combination.
        data_tests:
          - not_null

  - name: field_parity
    description: >
      The final field-parity table. Starts from all_comb (Venn regions for
      fully-matched EID triples, with every non-empty combination guaranteed
      present) and folds in each source's null-EID records via scalar subqueries:
      a record with a null enterprise ID cannot be matched to any other system,
      so it is added to its own source's single-source region (ad_null_fields ->
      AD-only, bst_null_fields -> BST-only, sap_null_plots -> SAP-only).
      Multi-source regions are unchanged. bst / sap / ad are 1/0 membership flags
      and count is the number of fields in that region; the counts sum to every
      field across all three systems. Feeds the parity Venn diagram and the
      overall parity metric.
    data_tests:
      - unique_combination:
          columns: [bst, sap, ad]
    columns:
      - name: bst
        description: 1 if the field belongs to the BST set, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: sap
        description: 1 if the field belongs to the SAP set, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: ad
        description: 1 if the field belongs to the AD set, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: count
        description: >
          Number of fields in this region, including unmatched null-EID records
          in the single-source regions.
        data_tests:
          - not_null

  - name: overall_field_parity
    description: >
      Single-number "Overall Field Parity" metric: the count of fields present
      in all three systems (the 1,1,1 region of field_parity) divided by the
      total count of fields across all regions. One row, one column. 1.0 is
      perfect parity (every field exists in all three systems); values near 0
      mean little cross-system overlap. Intended as the headline number for
      tracking parity progress over time.
    columns:
      - name: overall_field_parity
        description: Fraction of all fields that exist in all three systems, in [0, 1].
        data_tests:
          - not_null

  # ---------------------------------------------------------------------------
  # Field-EID parity: a second Venn table that determines parity using the
  # field-level enterprise ID alone, showing how the full-hierarchy aspect of
  # the parity definition impacts parity. Each source splits into keyed
  # (field-level EID present, hence matchable — even when the farm or farmer
  # above is unkeyed) and unkeyed (no field-level EID) models, mirroring the
  # non_null/null split of the full-hierarchy pipeline. Per region, alongside
  # the field-EID match count, farm_parity_count and full_parity_count report
  # how many of those matches survive as the farm level and then the whole
  # farmer -> farm -> field hierarchy are also required to be in parity.
  # ---------------------------------------------------------------------------
  - name: ad_keyed_fields
    description: >
      Rows from ad_joined_fields where the field-level enterprise ID is
      populated, whether or not the farm and farmer EIDs above it are.
      Field-EID-only parity matches on the field EID alone, so these are the
      matchable AD fields for that definition (a superset of
      ad_non_null_fields). Complement of ad_unkeyed_fields.
    columns:
      - name: field_id
        description: AD native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field.
        data_tests:
          - unique
          - not_null
      - name: farm_id
        description: AD native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm; may be null.
      - name: farmer_id
        description: AD native primary key for the farm's farmer.
        data_tests:
          - not_null
      - name: farmer_enterprise_id
        description: Enterprise ID of the farmer; may be null.

  - name: bst_keyed_fields
    description: >
      Rows from bst_joined_fields where the field-level enterprise ID is
      populated, whether or not the farm and grower EIDs above it are.
      Field-EID-only parity matches on the field EID alone, so these are the
      matchable BST fields for that definition (a superset of
      bst_non_null_fields). Complement of bst_unkeyed_fields.
    columns:
      - name: field_id
        description: BST native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field.
        data_tests:
          - unique
          - not_null
      - name: farm_id
        description: BST native primary key for the field's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm; may be null.
      - name: grower_id
        description: BST native primary key for the farm's grower.
        data_tests:
          - not_null
      - name: grower_enterprise_id
        description: Enterprise ID of the grower; may be null.

  - name: sap_keyed_plots
    description: >
      Rows from sap_joined_plots where the plot-level enterprise ID is
      populated, whether or not the farm and partner EIDs above it are,
      de-duplicated to one row per plot EID. SAP re-keys plots — the same
      physical field re-surveyed under a new PLOT_ID but sharing the same
      plot EID — so those rows collapse to a single field (lowest PLOT_ID
      kept, the same convention as sap_non_null_plots but at the plot-EID
      grain, since field-EID-only parity matches on the plot EID alone) and
      each field is counted once. Complement of sap_unkeyed_plots, which keeps
      every unassigned-EID plot as its own row (an unmatched record can't be
      de-duplicated).
    columns:
      - name: plot_id
        description: >
          SAP native key of the representative plot kept for this field (the
          lowest PLOT_ID of the collapsed re-keyed rows).
        data_tests:
          - unique
          - not_null
      - name: plot_enterprise_id
        description: Enterprise ID of the plot; the model's grain.
        data_tests:
          - unique
          - not_null
      - name: farm_id
        description: SAP native key for the plot's farm.
        data_tests:
          - not_null
      - name: farm_enterprise_id
        description: Enterprise ID of the farm; may be null.
      - name: partner_id
        description: SAP native key for the farm's partner.
        data_tests:
          - not_null
      - name: partner_enterprise_id
        description: Enterprise ID of the partner; may be null.

  - name: ad_unkeyed_fields
    description: >
      Rows from ad_joined_fields where the field-level enterprise ID is null.
      Whatever is assigned higher up the hierarchy, these fields cannot be
      matched to another system on the field EID, so field-EID-only parity
      counts each one in the AD-only region. Complement of ad_keyed_fields.
    columns:
      - name: field_id
        description: AD native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field; always null at this grain.
        data_tests:
          - is_null

  - name: bst_unkeyed_fields
    description: >
      Rows from bst_joined_fields where the field-level enterprise ID is null.
      Whatever is assigned higher up the hierarchy, these fields cannot be
      matched to another system on the field EID, so field-EID-only parity
      counts each one in the BST-only region. Complement of bst_keyed_fields.
    columns:
      - name: field_id
        description: BST native primary key for the field.
        data_tests:
          - unique
          - not_null
      - name: field_enterprise_id
        description: Enterprise ID of the field; always null at this grain.
        data_tests:
          - is_null

  - name: sap_unkeyed_plots
    description: >
      Rows from sap_joined_plots where the plot-level enterprise ID is null.
      Whatever is assigned higher up the hierarchy, these plots cannot be
      matched to another system on the plot EID, so field-EID-only parity
      counts each one in the SAP-only region. Re-key de-duplication does not
      apply — an unassigned plot can't be matched or collapsed — so every row
      stays individual. Complement of sap_keyed_plots.
    columns:
      - name: plot_id
        description: SAP native key for the plot.
        data_tests:
          - unique
          - not_null
      - name: plot_enterprise_id
        description: Enterprise ID of the plot; always null at this grain.
        data_tests:
          - is_null

  - name: unioned_field_eids
    description: >
      Field-level enterprise IDs from every source that carries one (AD and
      BST fields, SAP plots), stacked into a single column and de-duplicated:
      the universe of matchable field EIDs for field-EID-only parity. Sourced
      from the keyed models, so every EID is populated; IDs shared across
      sources (the cross-system overlap) collapse to one row.
    columns:
      - name: field_eid
        description: >
          Enterprise ID of the field-level entity (field in AD and BST, plot
          in SAP).
        data_tests:
          - unique
          - not_null

  - name: keyed_joined
    description: >
      The universe of matchable field EIDs (unioned_field_eids) left-joined
      back to each source's keyed model to record, per field EID, which of the
      three systems contain it and, for each system that does, the farm and
      farmer EIDs that system hangs the field under. The join key is the field
      EID alone, so a source is flagged present even when it ties the field to
      a different farm or farmer than the other systems — that disagreement is
      what the parity flags measure. farm_in_parity is true when the field EID
      is in at least two systems and every containing system agrees on a
      non-null farm EID; farmer_in_parity is the same agreement at the farmer
      level; full_in_parity is both at once, i.e. the full farmer -> farm ->
      field hierarchy matches (the full-hierarchy definition used by
      field_parity). Null is never a match, and a field EID in only one system
      has no counterpart to be in parity with, so its flags are false. One row
      per field EID; feeds the downstream field-EID parity (Venn) table.
    columns:
      - name: field_eid
        description: >
          Enterprise ID of the field-level entity (field in AD and BST, plot
          in SAP).
        data_tests:
          - unique
          - not_null
      - name: in_ad
        description: True when this field EID exists in the AD keyed model.
        data_tests:
          - not_null
      - name: in_bst
        description: True when this field EID exists in the BST keyed model.
        data_tests:
          - not_null
      - name: in_sap
        description: True when this field EID exists in the SAP keyed model.
        data_tests:
          - not_null
      - name: ad_farm_eid
        description: Farm EID the field sits under in AD; null when absent or unassigned.
      - name: bst_farm_eid
        description: Farm EID the field sits under in BST; null when absent or unassigned.
      - name: sap_farm_eid
        description: Farm EID the plot sits under in SAP; null when absent or unassigned.
      - name: ad_farmer_eid
        description: Farmer EID the field rolls up to in AD; null when absent or unassigned.
      - name: bst_farmer_eid
        description: Grower EID the field rolls up to in BST; null when absent or unassigned.
      - name: sap_farmer_eid
        description: Partner EID the plot rolls up to in SAP; null when absent or unassigned.
      - name: farm_in_parity
        description: >
          True when the field EID is in at least two systems and every
          containing system agrees on a non-null farm EID.
        data_tests:
          - not_null
      - name: farmer_in_parity
        description: >
          True when the field EID is in at least two systems and every
          containing system agrees on a non-null farmer EID.
        data_tests:
          - not_null
      - name: full_in_parity
        description: >
          True when both farm_in_parity and farmer_in_parity hold, i.e. the
          full hierarchy matches across every containing system.
        data_tests:
          - not_null

  - name: keyed_parity
    description: >
      Field-EID parity table aggregating keyed_joined to one row per Venn
      region: each distinct combination of which systems contain a matchable
      field EID. bst / sap / ad are 1/0 membership flags; count is the number
      of field EIDs in the region, farm_parity_count how many of them also
      have the farm level in parity, and full_parity_count how many have the
      full farmer -> farm -> field hierarchy in parity. Single-source regions
      always carry 0 in both parity counts here — no counterpart system, so no
      field can be in parity — which downstream field_eid_parity converts to
      null (not applicable). The all-zero region never appears because every
      field EID belongs to at least one source, so the counts sum to the full
      keyed_joined population.
    data_tests:
      - unique_combination:
          columns: [bst, sap, ad]
    columns:
      - name: bst
        description: 1 if the field EID exists in BST, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: sap
        description: 1 if the field EID exists in SAP, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: ad
        description: 1 if the field EID exists in AD, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: count
        description: Number of distinct field EIDs in this region.
        data_tests:
          - not_null
      - name: farm_parity_count
        description: >
          Of count, how many also have the farm level in parity across the
          region's systems.
        data_tests:
          - not_null
      - name: full_parity_count
        description: >
          Of count, how many have the full farmer -> farm -> field hierarchy
          in parity across the region's systems.
        data_tests:
          - not_null

  - name: keyed_all_comb
    description: >
      keyed_parity with every non-empty membership combination guaranteed
      present. A region with no matchable field EIDs is absent from
      keyed_parity; this model backfills those combinations with counts of 0
      so all 2^3 - 1 = 7 non-empty (bst, sap, ad) combinations always appear.
      The all-zero combination is intentionally excluded. Downstream of
      keyed_parity, upstream of field_eid_parity.
    data_tests:
      - unique_combination:
          columns: [bst, sap, ad]
    columns:
      - name: bst
        description: 1 if the field EID exists in BST, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: sap
        description: 1 if the field EID exists in SAP, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: ad
        description: 1 if the field EID exists in AD, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: count
        description: >
          Number of distinct field EIDs in this region; 0 for a backfilled
          combination.
        data_tests:
          - not_null
      - name: farm_parity_count
        description: >
          Of count, how many also have the farm level in parity; 0 for a
          backfilled combination.
        data_tests:
          - not_null
      - name: full_parity_count
        description: >
          Of count, how many have the full hierarchy in parity; 0 for a
          backfilled combination.
        data_tests:
          - not_null

  - name: field_eid_parity
    description: >
      The final field-EID parity table: the parity Venn when parity is
      determined using the field EIDs alone, built to show how the
      full-hierarchy aspect of the parity definition impacts parity. Starts
      from keyed_all_comb (Venn regions for matchable field EIDs, with every
      non-empty combination guaranteed present) and folds each source's
      unkeyed records into its own single-source region via scalar subqueries,
      mirroring field_parity's handling of null-EID records; multi-source
      regions are unchanged. bst / sap / ad are 1/0 membership flags; count is
      the number of fields in the region, farm_parity_count how many of the
      region's field-EID matches also have the farm level in parity, and
      full_parity_count how many have the full farmer -> farm -> field
      hierarchy in parity (the definition used by field_parity — its center
      count equals this table's center full_parity_count). In single-source
      regions both parity counts are null rather than 0: with no counterpart
      system the hierarchy comparison does not apply, and a 0 would misread as
      a measured result. Comparing the three measures per region shows how
      much each additional hierarchy requirement shrinks the overlap. Feeds
      the leadership Venn dashboard alongside field_parity.
    data_tests:
      - unique_combination:
          columns: [bst, sap, ad]
    columns:
      - name: bst
        description: 1 if the field belongs to the BST set, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: sap
        description: 1 if the field belongs to the SAP set, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: ad
        description: 1 if the field belongs to the AD set, else 0.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: count
        description: >
          Number of fields in this region under field-EID-only parity,
          including unkeyed records in the single-source regions.
        data_tests:
          - not_null
      - name: farm_parity_count
        description: >
          Of the region's field-EID matches, how many also have the farm level
          in parity across the region's systems. Null in single-source
          regions, where the hierarchy comparison does not apply.
      - name: full_parity_count
        description: >
          Of the region's field-EID matches, how many have both the farm and
          farmer levels in parity, i.e. the full hierarchy matches. Null in
          single-source regions, where the hierarchy comparison does not
          apply.
